name: PS4 probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp >/dev/null
          cd apps/ps4/hxtest
          {
            haxe -cpp out -main Main -D HXCPP_M64 -D no-compilation 2>&1 | tail -5
            ls out
            cat out/Build.xml | head -60
            echo ---- hxcpp tree
            H=$(haxelib libpath hxcpp)
            ls $H/src $H/src/hx | head -80
            echo ---- hx Build.xml
            grep -n "<file\|<section\|<compilerflag\|<files\|<target" $H/src/hx/Build.xml | head -80
          } 2>&1 > probe.txt
          python3 -c "t=open('probe.txt').read().replace('%','%25').replace('\n','%0A'); print('::notice title=probe::'+t)"
