name: Build PS4 native test (graphics)

# Native port, step 2a: a test package for a jailbroken PS4 (GoldHEN). It is OpenOrbis' own "piglet" sample (OpenGL ES 2 on the
# PS4) with the Echo Engine icon as its texture. If it shows the icon, the graphics side of a native Echo Engine can work.
# Run by hand: Actions > Build PS4 native test > Run workflow. The package goes to the "native-test" release.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ps4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            set -e
            sudo apt-get update -qq
            sudo apt-get install -y -qq clang lld imagemagick >/dev/null
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
            cd /tmp
            for u in http://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
                     http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb; do
              curl -fsSL "$u" -o libssl1.1.deb && break
            done
            sudo dpkg -i libssl1.1.deb

            mkdir -p /tmp/tc && cd /tmp/tc
            gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern 'toolchain-llvm-18.tar.gz'
            tar xzf toolchain-llvm-18.tar.gz
            export OO_PS4_TOOLCHAIN=/tmp/tc/OpenOrbis/PS4Toolchain
            chmod +x "$OO_PS4_TOOLCHAIN"/bin/linux/*

            git clone -q --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain /tmp/oo
            mkdir -p /tmp/work && cp -r /tmp/oo/samples/piglet /tmp/work/piglet
            cd /tmp/work/piglet

            # same size as the sample's texture, with the Echo Engine icon
            identify assets/images/rgba_texture.png
            size=$(identify -format '%wx%h' assets/images/rgba_texture.png)
            convert "$GITHUB_WORKSPACE/art/iconOG.png" -background none -resize "$size" -gravity center -extent "$size" PNG32:assets/images/rgba_texture.png
            identify assets/images/rgba_texture.png
            convert "$GITHUB_WORKSPACE/art/iconOG.png" -background none -resize 512x512 -gravity center -extent 512x512 sce_sys/icon0.png

            sed -i \
              -e 's/^TITLE .*/TITLE       := Echo Engine Native Test/' \
              -e 's/^VERSION .*/VERSION     := 1.20/' \
              -e 's/^TITLE_ID .*/TITLE_ID    := ECHO00013/' \
              -e 's/^CONTENT_ID .*/CONTENT_ID  := IV0000-ECHO00013_00-ECHONATIVETEST00/' \
              Makefile
            grep -n "^TITLE\|^VERSION\|^CONTENT_ID" Makefile
            make
            ls -la *.pkg
            cp ./*.pkg "$GITHUB_WORKSPACE/Echo-Engine-native-test-graphics-ps4.pkg"
          } 2>&1 | tee ps4.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -40 ps4.log | python3 -c "import sys; t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A'); print('::error title=PS4 build failed::'+t)"
          fi
          exit $status

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view native-test >/dev/null 2>&1 || gh release create native-test --prerelease --title "Native port tests (PS4)" \
            --notes "Test packages for the native PS4 port. For jailbroken consoles (GoldHEN). They are experiments."
          gh release upload native-test Echo-Engine-native-test-graphics-ps4.pkg --clobber
